<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>第二大隊｜住宅及工廠火警熱點</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>
*{box-sizing:border-box}html,body{height:100%;margin:0;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;color:#172b3a}header{background:#13324b;color:white;padding:10px 14px 9px;display:flex;align-items:center;justify-content:space-between;gap:8px}header strong{font-size:16px}header small{font-size:11px;color:#d9e8f0}#tabs{display:flex;background:white;padding:8px;gap:7px;border-bottom:1px solid #ddd}#tabs button{flex:1;border:1px solid #b9c9d3;border-radius:9px;background:white;padding:9px 2px;font-size:15px;font-weight:700;color:#233c4c}#tabs button.active{background:#155b85;color:white;border-color:#155b85}#map{height:calc(100dvh - 111px);min-height:350px}#stats{position:absolute;z-index:900;left:10px;bottom:20px;width:min(355px,calc(100% - 20px));max-height:55dvh;overflow:auto;background:#fff;box-shadow:0 3px 16px #0004;border-radius:12px;padding:13px;display:none}#stats.open{display:block}.tools{position:absolute;right:10px;top:121px;z-index:950;display:flex;flex-direction:column;gap:7px}.tools button{border:0;background:#fff;border-radius:9px;padding:10px;box-shadow:0 2px 8px #0003;font-weight:700;color:#123}table{width:100%;border-collapse:collapse;font-size:13px;text-align:center}th{background:#edf2f5}th,td{padding:6px 3px;border-bottom:1px solid #eee}td:nth-child(2){text-align:left}h3{margin:0 0 8px}p{font-size:12px;line-height:1.5}.pill{display:inline-block;border-radius:9px;padding:2px 8px;background:#e6f2fa}.leaflet-control-attribution{font-size:9px!important} .legend{position:absolute;z-index:800;left:10px;top:122px;background:#fffffff2;border-radius:9px;padding:7px 9px;font-size:11px;box-shadow:0 1px 5px #0002;max-width:190px}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px}.vlabel{white-space:nowrap;background:white;border:1px solid #bc3535;border-radius:10px;padding:2px 5px;font-size:11px;font-weight:bold}.leaflet-div-icon{background:transparent;border:0}@media(max-width:550px){header strong{font-size:14px}#map{height:calc(100dvh - 107px)}.tools{top:114px}.legend{top:114px}#stats{max-height:58dvh}}
</style></head><body><header><div><strong>第二大隊｜住宅及工廠火警熱點</strong><div><small>113/11/13–115/11/13　·　竹南／後龍／造橋</small></div></div><span id="count" style="font-size:15px;font-weight:800"></span></header><div id="tabs"><button data-town="竹南鎮" class="active">竹南鎮</button><button data-town="後龍鎮">後龍鎮</button><button data-town="造橋鄉">造橋鄉</button></div><div id="map"></div><div class="legend"><div><span class="dot" style="background:#1599c6"></span>住宅　<span class="dot" style="background:#d64b32"></span>工廠倉庫</div><div>橘紅色：案件較集中</div><div id="tile-status"></div></div><div class="tools"><button id="toggle-stats">☷ 村里排名</button><button id="toggle-labels">顯示里名</button><button id="toggle-heat">關閉熱度</button></div><section id="stats"><h3 id="stat-title"></h3><div id="table"></div><p>案件依官方村里界線歸屬；熱度不等於火災風險。地址排除「附近、路口、隔壁、對面、不詳、不明、交流道、旁邊」等描述。正式使用前請核對派遣座標。</p></section><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script><script src="./data.js?v=20261113fix2"></script><script>
const D=window.FIRE_DATA;
let current='竹南鎮', group=null, labelGroup=null, heat=null, showLabels=false, showHeat=true;
const status=document.getElementById('tile-status');
const map=L.map('map',{zoomControl:true,preferCanvas:true}).setView([24.68,120.86],11);
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',{attribution:'Tiles © Esri',maxZoom:18}).on('tileerror',()=>{status.textContent='道路底圖連線異常'}).addTo(map);
function render(t){
  current=t;
  document.querySelectorAll('[data-town]').forEach(b=>b.classList.toggle('active',b.dataset.town===t));
  const d=D && D[t];
  if(!d){status.textContent='找不到'+t+'資料，請確認 data.js';return;}
  document.getElementById('count').textContent=d.total+' 件';
  if(group)map.removeLayer(group);
  if(labelGroup)map.removeLayer(labelGroup);
  if(heat)map.removeLayer(heat);
  group=L.layerGroup().addTo(map);labelGroup=L.layerGroup();heat=null;
  const counts=d.counts||{};
  let warnings=[];
  for(const f of (d.villages||[])){
    try{
      const name=f.properties?.VILLNAME||'未命名村里',c=counts[name]||{'住宅':0,'工廠倉庫':0};
      const polygon=L.geoJSON(f,{style:{color:'#2169a3',weight:1.25,fillOpacity:.015}}).bindPopup('<b>'+name+'</b><br>住宅 '+(c['住宅']||0)+' 件<br>工廠倉庫 '+(c['工廠倉庫']||0)+' 件').addTo(group);
      if(counts[name]){
        const p=polygon.getBounds().getCenter();
        L.marker(p,{icon:L.divIcon({html:'<span class="vlabel">'+name+' '+((c['住宅']||0)+(c['工廠倉庫']||0))+'件</span>',iconSize:[0,0]})}).addTo(labelGroup);
      }
    }catch(e){warnings.push('村里圖層錯誤: '+e.message);console.warn(e)}
  }
  for(const r of (d.cases||[])){
    try{L.circleMarker([r[0],r[1]],{radius:4,color:'white',weight:1,fillColor:r[3]==='住宅'?'#1599c6':'#d64b32',fillOpacity:.95}).bindPopup('<b>'+r[2]+'</b><br>'+r[3]+'火警').addTo(group)}
    catch(e){warnings.push('案件位置錯誤: '+e.message);console.warn(e)}
  }
  try{
    if(typeof L.heatLayer==='function'){
      heat=L.heatLayer((d.cases||[]).map(r=>[r[0],r[1],.75]),{radius:23,blur:19,maxZoom:15,gradient:{.2:'#2b63d9',.4:'#00c8e0',.6:'#8df000',.8:'#ffb400',1:'#e33a21'}});
      if(showHeat)heat.addTo(map);
    }else{warnings.push('熱度套件未載入，案件位置仍可顯示')}
  }catch(e){warnings.push('熱度顯示錯誤: '+e.message);console.warn(e)}
  if(showLabels)labelGroup.addTo(map);
  const rank=Object.entries(counts).map(([name,c])=>({name,...c,total:(c['住宅']||0)+(c['工廠倉庫']||0)})).sort((a,b)=>b.total-a.total||a.name.localeCompare(b.name,'zh-Hant'));
  document.getElementById('stat-title').textContent=t+'｜共 '+d.total+' 件';
  document.getElementById('table').innerHTML='<table><thead><tr><th>排名</th><th>村里</th><th>合計</th><th>住宅</th><th>工廠</th></tr></thead><tbody>'+rank.map((r,i)=>`<tr><td>${i+1}</td><td>${r.name}</td><td><b>${r.total}</b></td><td>${r['住宅']||0}</td><td>${r['工廠倉庫']||0}</td></tr>`).join('')+'</tbody></table>';
  if(d.bounds)map.fitBounds(d.bounds,{padding:[15,15]});
  status.textContent=warnings.length?'部分圖層異常：'+warnings[0]:'';
}
document.querySelectorAll('[data-town]').forEach(b=>b.addEventListener('click',()=>{try{render(b.dataset.town)}catch(e){status.textContent='切換錯誤：'+e.message;console.error(e)}}));
document.getElementById('toggle-stats').onclick=()=>document.getElementById('stats').classList.toggle('open');
document.getElementById('toggle-labels').onclick=()=>{showLabels=!showLabels;if(labelGroup){if(showLabels)labelGroup.addTo(map);else map.removeLayer(labelGroup)}document.getElementById('toggle-labels').textContent=showLabels?'隱藏里名':'顯示里名'};
document.getElementById('toggle-heat').onclick=()=>{showHeat=!showHeat;if(heat){if(showHeat)heat.addTo(map);else map.removeLayer(heat)}document.getElementById('toggle-heat').textContent=showHeat?'關閉熱度':'顯示熱度'};
try{render(current)}catch(e){status.textContent='載入錯誤：'+e.message;console.error(e)}
</script></body></html>
